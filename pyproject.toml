[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pemfc-dedalus"
version = "0.5.0"
description = "3D PEMFC multiphysics modelling with Dedalus"
requires-python = ">=3.11"
dependencies = [
    "dedalus>=3.0",
    "numpy>=1.26",
    "h5py>=3.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "ruff>=0.13",
    "mypy>=1.18",
]
analysis = [
    "matplotlib>=3.8",
]

[project.scripts]
pemfc-cathode-3d = "pemfc_dedalus.cathode_3d:main"
pemfc-cathode-electrochem-3d = "pemfc_dedalus.cathode_electrochem_3d:main"
pemfc-cathode-hydrated-3d = "pemfc_dedalus.cathode_hydrated_3d:main"
pemfc-membrane-1d = "pemfc_dedalus.membrane_1d:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
exclude = ["build/", "dist/"]

[[tool.mypy.overrides]]
module = ["dedalus.*", "h5py"]
ignore_missing_imports = true
