[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pemfc-dedalus"
version = "0.1.0"
description = "3D PEMFC multiphysics modelling with Dedalus"
requires-python = ">=3.11"
dependencies = [
    "dedalus>=3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pemfc-cathode-3d = "pemfc_dedalus.cathode_3d:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
