name: CI

on:
  push:
    branches:
      - main
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  OMP_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: python -m pip install "ruff>=0.13"

      - name: Check formatting and lint
        run: python -m ruff check src tests scripts

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libopenmpi-dev \
            openmpi-bin \
            libfftw3-dev \
            libfftw3-mpi-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          export CC=mpicc
          export MPICC=mpicc
          export CFLAGS="$(mpicc --showme:compile)"
          export LDFLAGS="$(mpicc --showme:link)"
          python -m pip install -e '.[test]'

      - name: Type-check
        run: python -m mypy src tests scripts

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libopenmpi-dev \
            openmpi-bin \
            libfftw3-dev \
            libfftw3-mpi-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          export CC=mpicc
          export MPICC=mpicc
          export CFLAGS="$(mpicc --showme:compile)"
          export LDFLAGS="$(mpicc --showme:link)"
          python -m pip install -e '.[test]'

      - name: Run unit tests
        run: python -m pytest -q

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs:
      - ruff
      - mypy
      - pytest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
